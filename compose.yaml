services:
  dev:
    build: .
    env_file: .env
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run setup first}
      POSTGRES_USER: ${POSTGRES_USER:?Run setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
