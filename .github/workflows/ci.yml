name: Entwicklungsumgebung prüfen
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lokale Konfiguration erzeugen
        run: docker compose -f compose.setup.yaml run --rm setup
      - name: Entwicklungsumgebung bauen und starten
        run: docker compose up --build --wait --wait-timeout 180
      - name: Code prüfen
        run: |
          docker compose exec -T dev ruff check .
          docker compose exec -T dev ruff format --check .
          docker compose exec -T dev python -m pip check
      - name: Python, Django und PostgreSQL prüfen
        run: docker compose exec -T dev python scripts/check_environment.py
      - name: Diagnose bei Fehlern
        if: failure()
        run: docker compose logs
      - name: Aufräumen
        if: always()
        run: docker compose down --volumes
